---
- name: Retrieve tunnel credentials from Vault
  community.hashi_vault.vault_read:
    url: "{{ vault_addr }}"
    token: "{{ vault_token }}"
    path: "{{ tunnel_client_vault_mount }}/data/{{ tunnel_client_vault_path }}"
  register: _tunnel_client_secret
  delegate_to: localhost
  become: false
  run_once: true
  failed_when: false

- name: Set vault secret data fact
  ansible.builtin.set_fact:
    tunnel_client_secret_data: "{{ _tunnel_client_secret.data | default({}) }}"

# Модуль может вернуть как сам секрет, так и сырой KV v2-ответ
# (обёртка data.data.data) — снимаем обёртку, пока не появятся поля секрета
- name: Unwrap KV v2 envelope
  ansible.builtin.set_fact:
    tunnel_client_secret_data: "{{ tunnel_client_secret_data.data }}"
  when: >-
    tunnel_client_secret_data is mapping
    and tunnel_client_secret_data.get('data', none) is mapping
    and 'login' not in tunnel_client_secret_data
  loop: [1, 2]
