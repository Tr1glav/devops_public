---
- name: Get admin password secret
  kubernetes.core.k8s_info:
    kubeconfig: "{{ awx_k8s_kubeconfig }}"
    kind: Secret
    namespace: "{{ awx_k8s_namespace }}"
    name: "{{ awx_k8s_instance_name }}-admin-password"
  register: awx_k8s_admin_secret
  no_log: true

- name: Display awx access information
  ansible.builtin.debug:
    msg: >
      AWX доступен на {{ 'https' if awx_k8s_enable_ssl else 'http' }}://{{
      awx_k8s_domain if awx_k8s_ingress_type == 'ingress'
      else ansible_host ~ ':' ~ awx_k8s_nodeport_port }},
      пользователь {{ awx_k8s_admin_user }},
      пароль {{ awx_k8s_admin_secret.resources[0].data.password | b64decode }}
  when: awx_k8s_admin_secret.resources | length > 0
