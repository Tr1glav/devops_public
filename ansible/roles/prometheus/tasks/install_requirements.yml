---
- name: Создание группы {{ prometheus_group }}
  ansible.builtin.group:
    name: "{{ prometheus_group }}"
    state: present
    system: true

- name: Создание пользователя {{ prometheus_user }}
  ansible.builtin.user:
    name: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    system: true
    shell: "/usr/sbin/nologin"
    home: "{{ prometheus_dir }}"
    create_home: true

- name: Create directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: '0775'
  loop:
    - "{{ prometheus_dir }}"
    - "{{ prometheus_config_dir }}"
    - "{{ prometheus_data_dir | default(prometheus_dir + '/data') }}"
    - "/tmp/prometheus-{{ prometheus_version }}.linux-amd64/"
    - "{{ prometheus_dir }}/targets"

- name: Download Prometheus
  ansible.builtin.get_url:
    url: "{{ prometheus_url }}"
    dest: "/tmp/prometheus.tar.gz"
    mode: '0644'

- name: Extract Prometheus
  ansible.builtin.unarchive:
    src: "/tmp/prometheus.tar.gz"
    dest: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64/"
    remote_src: true
    extra_opts: ["--strip-components=1"]

- name: Copy Prometheus files
  ansible.builtin.copy:
    src: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64/{{ item }}"
    dest: "{{ prometheus_dir }}/{{ item }}"
    remote_src: true
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: '0755'
  loop:
    - "prometheus"
    - "promtool"
