---
- name: Configure etcd environment
  ansible.builtin.template:
    src: etcd.conf.j2
    dest: /etc/etcd/etcd.conf
    owner: etcd
    group: etcd
    mode: "0640"
  notify: restart etcd

- name: Configure etcd systemd service
  ansible.builtin.template:
    src: etcd.service.j2
    dest: /etc/systemd/system/etcd.service
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd and restart etcd

- name: Start etcd service
  ansible.builtin.systemd:
    name: etcd
    state: started
    enabled: true
    daemon_reload: true

- name: Wait for etcd to start
  ansible.builtin.wait_for:
    port: "{{ etcd_client_port }}"
    host: "<hidden-ip>"
    delay: 5
    timeout: 30
