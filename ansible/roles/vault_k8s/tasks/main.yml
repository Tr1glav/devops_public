---
- name: Add HashiCorp Helm repository
  kubernetes.core.helm_repository:
    name: hashicorp
    repo_url: "https://helm.releases.hashicorp.com"

- name: Create namespace
  kubernetes.core.k8s:
    name: "{{ vault_k8s_namespace }}"
    kind: Namespace
    state: present

- name: Prepare Vault values file
  ansible.builtin.set_fact:
    vault_values_file: "/tmp/vault-k8s-values-{{ inventory_hostname }}.yml"

- name: Generate Vault Helm values
  ansible.builtin.template:
    src: values.yml.j2
    dest: "{{ vault_values_file }}"
    mode: '0644'

- name: Deploy Vault via Helm
  kubernetes.core.helm:
    name: "{{ vault_k8s_release_name }}"
    chart_ref: hashicorp/vault
    chart_version: "{{ vault_k8s_helm_version }}"
    namespace: "{{ vault_k8s_namespace }}"
    values_files:
      - "{{ vault_values_file }}"
    state: present

- name: Wait for Vault to be ready
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: "{{ vault_k8s_namespace }}"
    label_selectors:
      - "app.kubernetes.io/name=vault"
    field_selectors:
      - "status.phase=Running"
    wait: true
    wait_timeout: 300

- name: Get Vault pod name
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: "{{ vault_k8s_namespace }}"
    label_selectors:
      - "app.kubernetes.io/name=vault"
      - "component=server"
  register: vault_pods

- name: Check if Vault is initialized
  kubernetes.core.k8s_exec:
    namespace: "{{ vault_k8s_namespace }}"
    pod: "{{ vault_pods.resources[0].metadata.name }}"
    command: "vault status -format=json"
  register: vault_status
  failed_when: false
  changed_when: false

- name: Initialize Vault if needed
  kubernetes.core.k8s_exec:
    namespace: "{{ vault_k8s_namespace }}"
    pod: "{{ vault_pods.resources[0].metadata.name }}"
    command: "vault operator init -key-shares=1 -key-threshold=1 -format=json"
  environment:
    VAULT_SKIP_VERIFY: "true"
  register: vault_init
  when: vault_status.rc != 0 or 'initialized' not in vault_status.stdout

- name: Store Vault unseal key
  ansible.builtin.set_fact:
    vault_unseal_key: >-
      {{ vault_init.stdout |
      from_json |
      json_query('unseal_keys_b64[0]') }}
    vault_root_token: >-
      {{ vault_init.stdout |
      from_json |
      json_query('root_token') }}
  when: vault_init is defined

- name: Unseal Vault
  kubernetes.core.k8s_exec:
    namespace: "{{ vault_k8s_namespace }}"
    pod: "{{ vault_pods.resources[0].metadata.name }}"
    command: "vault operator unseal {{ vault_unseal_key }}"
  environment:
    VAULT_SKIP_VERIFY: "true"
  when: vault_unseal_key is defined

- name: Enable Kubernetes auth
  kubernetes.core.k8s_exec:
    namespace: "{{ vault_k8s_namespace }}"
    pod: "{{ vault_pods.resources[0].metadata.name }}"
    command: "vault auth enable kubernetes"
  environment:
    VAULT_TOKEN: "{{ vault_root_token }}"
    VAULT_SKIP_VERIFY: "true"
  register: enable_k8s_auth
  failed_when: false

- name: Configure Kubernetes auth
  kubernetes.core.k8s_exec:
    namespace: "{{ vault_k8s_namespace }}"
    pod: "{{ vault_pods.resources[0].metadata.name }}"
    command: >-
      vault write auth/kubernetes/config
      kubernetes_host="https://$KUBERNETES_PORT_443_TCP_ADDR:443"
      kubernetes_ca_cert=@/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      token_reviewer_jwt=@/var/run/secrets/kubernetes.io/serviceaccount/token
  environment:
    VAULT_TOKEN: "{{ vault_root_token }}"
    VAULT_SKIP_VERIFY: "true"
  when: enable_k8s_auth.rc != 0

- name: Enable KV secrets engine v2
  kubernetes.core.k8s_exec:
    namespace: "{{ vault_k8s_namespace }}"
    pod: "{{ vault_pods.resources[0].metadata.name }}"
    command: "vault secrets enable -path=kv -version=2 kv"
  environment:
    VAULT_TOKEN: "{{ vault_root_token }}"
    VAULT_SKIP_VERIFY: "true"
  register: enable_kv
  failed_when: false

- name: Create default policy
  kubernetes.core.k8s_exec:
    namespace: "{{ vault_k8s_namespace }}"
    pod: "{{ vault_pods.resources[0].metadata.name }}"
    command: >-
      vault policy write app-default - << 'EOF'
      path "kv/*" {
        capabilities = ["read", "list"]
      }
      path "kv/data/*" {
        capabilities = ["create", "read", "update", "delete"]
      }
      EOF
  environment:
    VAULT_TOKEN: "{{ vault_root_token }}"
    VAULT_SKIP_VERIFY: "true"
  when: enable_kv.rc != 0

- name: Cleanup temp values file
  ansible.builtin.file:
    path: "{{ vault_values_file }}"
    state: absent
