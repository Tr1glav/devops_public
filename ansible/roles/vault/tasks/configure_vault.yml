---
- name: Configure Vault configuration
  ansible.builtin.template:
    src: "templates/vault.hcl.j2"
    dest: "{{ vault_config_dir }}/vault.hcl"
    owner: "{{ vault_user }}"
    group: "{{ vault_group }}"
    mode: '0640'
  notify: Restart Vault

- name: Configure systemd service
  ansible.builtin.template:
    src: "templates/vault.service.j2"
    dest: "/etc/systemd/system/vault.service"
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd
    - Start Vault

- name: Start Vault service
  ansible.builtin.systemd:
    name: vault
    enabled: true
    state: started

- name: Wait for Vault API availability
  ansible.builtin.uri:
    url: "{{ vault_api_addr }}/v1/sys/health"
    method: GET
    status_code: 200, 429, 472, 473, 501, 503
    timeout: 10
  register: _vault_health
  until: _vault_health.status in [200, 429, 472, 473, 501, 503]
  retries: 15
  delay: 5
  ignore_errors: true
  when: inventory_hostname == groups['vault']|first
