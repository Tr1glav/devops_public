---
- name: Create Vault group
  ansible.builtin.group:
    name: "{{ vault_group }}"
    state: present
    system: true

- name: Create Vault user
  ansible.builtin.user:
    name: "{{ vault_user }}"
    group: "{{ vault_group }}"
    system: true
    shell: /bin/false
    home: "{{ vault_data_dir }}"
    create_home: true

- name: Create working directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ vault_user }}"
    group: "{{ vault_group }}"
    mode: '0750'
  loop:
    - "{{ vault_config_dir }}"
    - "{{ vault_data_dir }}"
    - "{{ vault_data_dir }}/raft"
