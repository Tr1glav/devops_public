---
vault_version: "1.20.4"
vault_user: "vault"
vault_group: "vault"
vault_config_dir: "/etc/vault.d"
vault_data_dir: "/opt/vault/data"
vault_api_addr: "http://{{ ansible_host }}:8200"
vault_cluster_addr: "http://{{ ansible_host }}:8201"
vault_ha_storage: "raft"
vault_ui: true
vault_keyshares: 5
vault_keythreshold: 3
vault_unseal_keys: []
vault_root_token: ""
vault_tls_disabled: true
