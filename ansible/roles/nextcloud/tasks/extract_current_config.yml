---
- name: Read existing config if exists
  ansible.builtin.slurp:
    src: /var/www/nextcloud/config/config.php
  register: nextcloud_existing_config
  failed_when: false

- name: Check if config.php exists
  ansible.builtin.stat:
    path: /var/www/nextcloud/config/config.php
  register: nextcloud_config_file

- name: Extract instanceid from existing config
  ansible.builtin.set_fact:
    nextcloud_existing_instanceid: >-
      {{ nextcloud_existing_config.content |
      b64decode |
      regex_findall("'instanceid' => '([^']+)'") |
      first | default('') }}
  when: nextcloud_existing_config.content is defined

- name: Extract passwordsalt from existing config
  ansible.builtin.set_fact:
    nextcloud_existing_passwordsalt: >-
      {{ nextcloud_existing_config.content |
      b64decode |
      regex_findall("'passwordsalt' => '([^']+)'") |
      first | default('') }}
  when: nextcloud_existing_config.content is defined

- name: Extract secret from existing config
  ansible.builtin.set_fact:
    nextcloud_existing_secret: >-
      {{ nextcloud_existing_config.content |
      b64decode |
      regex_findall("'secret' => '([^']+)'") |
      first | default('') }}
  when: nextcloud_existing_config.content is defined
