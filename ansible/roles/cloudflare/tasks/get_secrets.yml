---
- name: Получение данных из Vault
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/{{ cloudflare_vault_secret_path }}"
    method: GET
    headers:
      X-Vault-Token: "{{ vault_token }}"
    validate_certs: "{{ cloudflare_vault_validate_certs | default(true) }}"
  register: _cloudflare_vault_response
  until: _cloudflare_vault_response.status == 200
  retries: 3
  delay: 2
  failed_when: false

- name: Извлечение данных из Vault (KV v2)
  ansible.builtin.set_fact:
    _cloudflare_vault_secret_data: >-
      {{ _cloudflare_vault_response.json.data.data }}

- name: Установка переменных из Vault
  ansible.builtin.set_fact:
    _cloudflare_token: "{{ _cloudflare_vault_secret_data.token }}"
    _cloudflare_zone_id: "{{ _cloudflare_vault_secret_data['dla.su_zone_id'] }}"
