---
k3s_version: v1.32.3+k3s1
k3s_mode: server

k3s_server_ip: "{{ ansible_host }}"
k3s_tls_san: []

k3s_disabled_components:
  - traefik
  - servicelb
  - local-storage

k3s_flannel_backend: wireguard-native
k3s_cluster_cidr: <hidden-ip>/16
k3s_service_cidr: <hidden-ip>/16
k3s_cluster_dns: <hidden-ip>

k3s_cluster_name: "{{ env | default('k3s') }}"
k3s_node_name: "{{ ansible_hostname }}"

k3s_data_dir: /var/lib/rancher/k3s
k3s_write_kubeconfig: true

k3s_install_script_url: https://get.k3s.io

k3s_firewall_ports:
  - port: 6443
    proto: tcp
    comment: Kubernetes API
  - port: 10250
    proto: tcp
    comment: Kubelet
  - port: 8472
    proto: udp
    comment: Flannel
  - port: 2379
    proto: tcp
    comment: etcd
  - port: 2380
    proto: tcp
    comment: etcd
