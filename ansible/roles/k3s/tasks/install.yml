---
- name: Install prerequisites
  ansible.builtin.package:
    name:
      - curl
      - iptables
    state: present

- name: Create config directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: Generate config.yaml
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0644"
  notify: Restart k3s

- name: Check if k3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Download install script
  ansible.builtin.get_url:
    url: "{{ k3s_install_script_url }}"
    dest: /tmp/k3s_install.sh
    mode: "0755"
    checksum: "{{ k3s_install_script_checksum | default(omit) }}"
  when: not k3s_binary.stat.exists

- name: Install k3s
  ansible.builtin.command:
    cmd: /tmp/k3s_install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_SKIP_START: "true"
  when: not k3s_binary.stat.exists
  register: k3s_install_result
  changed_when: k3s_install_result.rc == 0

- name: Enable and start k3s
  ansible.builtin.systemd:
    name: k3s
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for node to be ready
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s kubectl get nodes
  register: k3s_nodes
  retries: 12
  delay: 5
  until: k3s_nodes.rc == 0 and "NotReady" not in k3s_nodes.stdout
  changed_when: false
  when: k3s_mode == "server"

- name: Get kubeconfig
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: k3s_kubeconfig
  when:
    - k3s_mode == "server"
    - k3s_write_kubeconfig

- name: Display kubeconfig server
  ansible.builtin.debug:
    msg: >
      Kubeconfig written to /etc/rancher/k3s/k3s.yaml.
      To use from controller: copy and replace <hidden-ip> with {{ k3s_server_ip }}
  when:
    - k3s_mode == "server"
    - k3s_write_kubeconfig
    - k3s_kubeconfig is changed
