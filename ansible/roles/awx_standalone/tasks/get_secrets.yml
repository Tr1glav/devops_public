---
- name: Retrieve awx secrets from Vault
  community.hashi_vault.vault_read:
    url: "{{ vault_addr }}"
    token: "{{ vault_token }}"
    path: "{{ awx_vault_mount }}/data/{{ awx_vault_path }}"
  register: _awx_vault_secret
  delegate_to: localhost
  run_once: true
  failed_when: false
  become: false
  no_log: true

- name: Retrieve certs secrets from Vault
  community.hashi_vault.vault_read:
    url: "{{ vault_addr }}"
    token: "{{ vault_token }}"
    path: "{{ awx_certs_vault_mount }}/data/{{ awx_certs_vault_path }}"
  register: _awx_certs_vault_secret
  delegate_to: localhost
  run_once: true
  failed_when: false
  become: false
  no_log: true
  when: awx_enable_ssl

- name: Set awx credentials facts
  ansible.builtin.set_fact:
    awx_admin_password: >-
      {{ _awx_vault_secret.data.data.data['admin_password'] |
      default(awx_admin_password) }}
    awx_db_password: >-
      {{ _awx_vault_secret.data.data.data['db_password'] |
      default(awx_db_password) }}
    awx_secret_key: >-
      {{ _awx_vault_secret.data.data.data['secret_key'] |
      default(awx_secret_key) }}
  no_log: true
  when: _awx_vault_secret.data is defined

- name: Generate admin password if not provided
  ansible.builtin.set_fact:
    awx_admin_password: >-
      {{ lookup('password',
      '/dev/null length=' ~ awx_admin_password_len ~
      ' chars=ascii_letters,digits') }}
  no_log: true
  when: awx_admin_password | length == 0

- name: Generate database password if not provided
  ansible.builtin.set_fact:
    awx_db_password: >-
      {{ lookup('password',
      '/dev/null length=32 chars=ascii_letters,digits') }}
  no_log: true
  when: awx_db_password | length == 0

- name: Set SSL certificate facts from Vault
  ansible.builtin.set_fact:
    _awx_ssl_certificate: >-
      {{ _awx_certs_vault_secret.data.data.data['combined'] |
      default(_awx_certs_vault_secret.data.data.data['certificate']) |
      default('') }}
    _awx_ssl_private_key: >-
      {{ _awx_certs_vault_secret.data.data.data['private_key'] |
      default('') }}
  no_log: true
  when:
    - awx_enable_ssl
    - _awx_certs_vault_secret.data is defined
