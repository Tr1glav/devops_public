---
- name: Check for existing certificate for {{ current_domain }}
  ansible.builtin.stat:
    path: /etc/letsencrypt/live/{{ current_domain }}/cert.pem
  register: __certbot_cert_exists

- name: Run Certbot for {{ current_domain }}
  ansible.builtin.command: |
    certbot certonly \
      -v \
      --dns-cloudflare \
      --dns-cloudflare-credentials /etc/letsencrypt/cloudflare/cloudflare.ini \
      --non-interactive \
      --agree-tos \
      --dns-cloudflare-propagation-seconds 25 \
      --email {{ _certbot_vault_cf_secrets.json.data.data.admin_email }} \
      {% if __certbot_cert_exists.stat.exists and
        certbot_expand_existing %}--expand{% endif %} \
      -d {{ current_domain }}
  register: __certbot_run
  changed_when: "'No new certs' not in __certbot_run.stdout"
  # The packaged certbot.timer renewal (or a previous interrupted run) holds
  # /var/lib/letsencrypt/.certbot.lock; wait it out instead of failing the play.
  # Any other error satisfies `until` on the first try, so no retry storm on
  # e.g. Let's Encrypt rate limits.
  until: __certbot_run.rc == 0 or
    'Another instance of Certbot' not in __certbot_run.stderr
  retries: 10
  delay: 30
  failed_when: __certbot_run.rc != 0

- name: Combine certificate files for {{ current_domain }}
  ansible.builtin.shell:
    cmd: >-
      cat /etc/letsencrypt/live/{{ current_domain }}/fullchain.pem
      /etc/letsencrypt/live/{{ current_domain }}/privkey.pem
      > /etc/letsencrypt/live/{{ current_domain }}/combined.pem
  changed_when: false
