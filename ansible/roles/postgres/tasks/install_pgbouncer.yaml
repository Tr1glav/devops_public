---
- name: Ensure PgBouncer is installed
  ansible.builtin.apt:
    name: pgbouncer
    state: present
    update_cache: true
  when: ansible_os_family == 'Debian'
  tags: [packages, pgbouncer]

- name: Ensure PgBouncer directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ pgbouncer_user }}"
    group: "{{ pgbouncer_group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "/etc/pgbouncer", mode: "0755"}
    - {path: "/var/log/pgbouncer", mode: "0755"}
    - {path: "/var/run/pgbouncer", mode: "0755"}
  tags: [pgbouncer, config]

- name: Create PgBouncer user list file
  ansible.builtin.template:
    src: pgbouncer_userlist.txt.j2
    dest: "/etc/pgbouncer/userlist.txt"
    owner: "{{ pgbouncer_user }}"
    group: "{{ pgbouncer_group }}"
    mode: '0644'
  no_log: false
  tags: [pgbouncer, config]

- name: Ensure PgBouncer configuration is up to date
  ansible.builtin.template:
    src: pgbouncer.ini.j2
    dest: "/etc/pgbouncer/pgbouncer.ini"
    owner: "{{ pgbouncer_user }}"
    group: "{{ pgbouncer_group }}"
    mode: '0644'
  register: postgres_pgbouncer_config
  notify: restart pgbouncer
  tags: [pgbouncer, config]

- name: Deploy PgBouncer systemd service
  ansible.builtin.template:
    src: pgbouncer.service.j2
    dest: /etc/systemd/system/pgbouncer.service
    mode: '0644'
  tags: [pgbouncer, service]

- name: Create PgBouncer auth user in PostgreSQL
  community.postgresql.postgresql_user:
    name: "pgbouncer"
    password: "{{ pgbouncer_auth_user_password }}"
    role_attr_flags: "LOGIN"
    port: 5432
    login_user: "postgres"
    login_password: "{{ postgres_superuser_password }}"
    login_host: "{{ ansible_default_ipv4.address |
      default(ansible_all_ipv4_addresses[0]) }}"
  no_log: false
  when: postgres_is_master
  tags: [postgresql, pgbouncer]

- name: Ensure PgBouncer is running and enabled
  ansible.builtin.systemd:
    name: pgbouncer
    state: started
    enabled: true
    daemon_reload: true
  notify: restart pgbouncer
  tags: [pgbouncer, systemd]
