---
grafana_version: "11.2.0"
grafana_user: "grafana"
grafana_group: "grafana"
grafana_dir: "/opt/grafana"
grafana_config_dir: "/etc/grafana"
grafana_port: 3000
grafana_admin_user: "admin"

grafana_url: >-
  https://dl.grafana.com/oss/release/grafana-{{
  grafana_version }}.linux-amd64.tar.gz

grafana_prometheus_uid: "prometheus"

grafana_datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: "http://localhost:9090"
    isDefault: true
    uid: prometheus

grafana_dashboards:
  - name: system-overview
    uid: system-overview
  - name: node-overview
    uid: node-overview
