---
- name: Create nginx configuration directory
  ansible.builtin.file:
    path: "/etc/nginx/conf.d"
    state: directory
    mode: '0755'

- name: Remove default nginx site
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/nginx/sites-enabled/default
    - /etc/nginx/conf.d/default.conf
  notify: Restart nginx

- name: Deploy github cache configuration
  ansible.builtin.template:
    src: nginx-github-cache.conf.j2
    dest: "/etc/nginx/conf.d/github-cache.conf"
    owner: root
    group: root
    mode: '0644'
  notify: Restart nginx

- name: Configure nginx main settings
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "/etc/nginx/nginx.conf"
    owner: root
    group: root
    mode: '0644'
  notify: Restart nginx

- name: Create log files
  ansible.builtin.file:
    path: "{{ item }}"
    state: touch
    owner: "{{ nginx_user }}"
    group: "{{ nginx_group }}"
    mode: '0640'
  loop:
    - /var/log/nginx/github-api-access.log
    - /var/log/nginx/github-api-error.log
    - /var/log/nginx/github-raw-access.log
    - /var/log/nginx/github-raw-error.log
    - /var/log/nginx/github-assets-access.log
    - /var/log/nginx/github-assets-error.log
