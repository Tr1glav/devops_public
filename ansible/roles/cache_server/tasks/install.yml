---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install nginx and required packages
  ansible.builtin.package:
    name:
      - nginx
      - curl
      - ca-certificates
    state: present

- name: Install nginx-extras for additional modules
  ansible.builtin.package:
    name: nginx-extras
    state: present

- name: Create cache directory
  ansible.builtin.file:
    path: "{{ nginx_github_cache_path }}"
    state: directory
    owner: "{{ nginx_user }}"
    group: "{{ nginx_group }}"
    mode: '0755'
  notify: Restart nginx

- name: Create assets cache subdirectory
  ansible.builtin.file:
    path: "{{ nginx_github_cache_path }}/assets"
    state: directory
    owner: "{{ nginx_user }}"
    group: "{{ nginx_group }}"
    mode: '0755'
  notify: Restart nginx

- name: Create SSL directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - /etc/ssl/certs
    - /etc/ssl/private
  when: nginx_github_cache_ssl_enabled | bool
