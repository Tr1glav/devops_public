---
- name: Create node_exporter group
  ansible.builtin.group:
    name: "{{ node_exporter_group }}"
    state: present
    system: true

- name: Create node_exporter user
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    group: "{{ node_exporter_group }}"
    system: true
    shell: "/usr/sbin/nologin"
    home: "{{ node_exporter_dir }}"
    create_home: false

- name: Create Node Exporter directory
  ansible.builtin.file:
    path: "{{ node_exporter_dir }}"
    state: directory
    owner: "{{ node_exporter_user }}"
    group: "{{ node_exporter_group }}"
    mode: '0755'

- name: Download Node Exporter
  ansible.builtin.get_url:
    url: "{{ node_exporter_url }}"
    dest: "/tmp/node_exporter.tar.gz"
    mode: '0644'

- name: Create tmp Node Exporter directory
  ansible.builtin.file:
    path: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/"
    state: directory
    owner: "{{ node_exporter_user }}"
    group: "{{ node_exporter_group }}"
    mode: '0755'

- name: Extract Node Exporter
  ansible.builtin.unarchive:
    src: "/tmp/node_exporter.tar.gz"
    dest: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/"
    remote_src: true
    extra_opts: ["--strip-components=1"]

- name: Copy Node Exporter binary
  ansible.builtin.copy:
    src: >-
      /tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter
    dest: "{{ node_exporter_dir }}/node_exporter"
    remote_src: true
    owner: "{{ node_exporter_user }}"
    group: "{{ node_exporter_group }}"
    mode: '0755'

- name: Ensure correct ownership
  ansible.builtin.file:
    path: "{{ node_exporter_dir }}"
    owner: "{{ node_exporter_user }}"
    group: "{{ node_exporter_group }}"
    recurse: true

- name: Make script executable
  ansible.builtin.file:
    path: "{{ node_exporter_dir }}/{{ item }}"
    mode: "0755"
  loop:
    - "node_exporter"

- name: Create systemd service for Node Exporter
  ansible.builtin.template:
    src: "{{ role_path }}/templates/node_exporter.service.j2"
    dest: "/etc/systemd/system/node_exporter.service"
    mode: '0644'
  notify:
    - restart node_exporter

- name: Enable and start Node Exporter
  ansible.builtin.systemd:
    name: node_exporter
    enabled: true
    state: started
