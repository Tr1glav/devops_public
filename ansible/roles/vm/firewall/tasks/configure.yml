---
- name: Ensure iptables is installed
  ansible.builtin.package:
    name: iptables
    state: present

- name: Ensure iptables-persistent is installed (Debian/Ubuntu)
  ansible.builtin.package:
    name: iptables-persistent
    state: present
  when: ansible_os_family == "Debian"

- name: Create iptables directory
  ansible.builtin.file:
    path: /etc/iptables
    state: directory
    mode: '0755'

- name: Allow SSH (port 22)
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: 22
    jump: ACCEPT
    comment: "Allow SSH"
  register: ssh_rule

- name: Allow HTTPS (port 443)
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: 443
    jump: ACCEPT
    comment: "Allow HTTPS"
  register: https_rule

- name: Allow DNS
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: 53
    jump: ACCEPT
    comment: "Allow DNS"
  register: dns_rule

- name: Allow established and related connections
  ansible.builtin.iptables:
    chain: INPUT
    ctstate: ESTABLISHED,RELATED
    jump: ACCEPT
  register: established_input

- name: Allow established connections for OUTPUT
  ansible.builtin.iptables:
    chain: OUTPUT
    ctstate: ESTABLISHED,RELATED
    jump: ACCEPT
  register: established_output

- name: Allow all traffic on loopback interface
  ansible.builtin.iptables:
    chain: INPUT
    in_interface: lo
    jump: ACCEPT
  register: loopback_input

- name: Allow outgoing traffic on loopback
  ansible.builtin.iptables:
    chain: OUTPUT
    out_interface: lo
    jump: ACCEPT
  register: loopback_output

- name: Set default policies to DROP
  ansible.builtin.iptables:
    chain: "{{ item }}"
    policy: DROP
  loop:
    - INPUT
  register: default_policies

- name: Allow ICMP (ping) for troubleshooting
  ansible.builtin.iptables:
    chain: INPUT
    protocol: icmp
    jump: ACCEPT
    comment: "Allow ICMP"
  when: allow_icmp | default(true)
  register: icmp_rule

- name: Save iptables rules
  ansible.builtin.shell:
    cmd: |
      iptables-save > /etc/iptables/rules.v4
      ip6tables-save > /etc/iptables/rules.v6 2>/dev/null || true
  register: save_rules
  changed_when: false

- name: Enable netfilter-persistent service (Debian)
  ansible.builtin.systemd:
    name: netfilter-persistent
    enabled: true
    state: started
  failed_when: false

- name: Show current iptables rules
  ansible.builtin.command:
    cmd: iptables -L -n -v
  register: iptables_rules
  changed_when: false

- name: Display iptables rules
  ansible.builtin.debug:
    var: iptables_rules.stdout_lines
