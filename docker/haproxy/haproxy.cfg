global
    log stderr local2
    chroot /var/lib/haproxy
    pidfile /var/run/haproxy.pid
    maxconn 4000
    stats socket /var/lib/haproxy/stats expose-fd listeners
    master-worker

resolvers docker_resolver
    nameserver dns1 192.168.0.1:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold other      10s
    hold refused    10s
    hold nx         10s
    hold timeout    10s
    hold valid      10s
    hold obsolete   10s

defaults
    timeout connect 10s
    timeout client 30s
    timeout server 30s
    log global
    mode http
    option httplog

frontend service_web
    bind *:80
    default_backend service

backend service
    balance roundrobin
    server-template service1- 6 service1:80 check resolvers docker_resolver init-addr libc,none