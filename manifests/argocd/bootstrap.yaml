---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: auto-deployments
  namespace: argocd
spec:
  generators:
    - git:
      repoURL: https://github.com/Tr1glav/manifestos.git
      revision: HEAD
      directories:
        - path: "deployments/*"
  template:
    metadata:
      name: '{{path.basename}}'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/Tr1glav/manifestos.git
        targetRevision: HEAD
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - PrunePropagationPolicy=foreground
          - PruneLast=true
          - ApplyOutOfSyncOnly=true
      revisionHistoryLimit: 2  # Ограничивает количество хранимых ревизий
